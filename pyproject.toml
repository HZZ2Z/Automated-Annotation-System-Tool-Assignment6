[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-data-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jsonschema==4.26.0",
    "numpy==2.5.2",
    "opencv-python-headless==4.14.0.94",
]

[project.optional-dependencies]
dev = [
    "attrs==26.1.0",
    "iniconfig==2.3.0",
    "jsonschema-specifications==2025.9.1",
    "packaging==26.3",
    "pluggy==1.6.0",
    "Pygments==2.21.0",
    "pytest==8.4.2",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]
